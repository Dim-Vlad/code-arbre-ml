<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partager la page — Encodeur Arbre des mots</title>
  <link rel="icon" type="image/svg+xml" href="Images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="Images/favicon-32.png">
  <link rel="apple-touch-icon" href="Images/apple-touch-icon.png">
  <style>
    :root{color-scheme:light;--bg:#f2f5f1;--surface:#fff;--ink:#1c2a24;--muted:#5c6b63;--line:#d3dbd5;--accent:#1f6b4f;--accent-ink:#fff;--focus:#0b7285}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(100%,520px);margin:8vh auto 0;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:16px;text-align:center;box-shadow:0 8px 28px #1c2a2412}
    h1{margin:0;font-size:1.6rem;line-height:1.25}
    p{color:var(--muted)}
    #qr{display:block;width:240px;height:240px;max-width:100%;margin:24px auto 12px;border:1px solid var(--line);border-radius:8px}
    .url-row{display:flex;gap:8px;margin-top:20px}
    input{min-width:0;flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}
    button,.back{display:inline-block;padding:10px 16px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
    button:focus-visible,.back:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    #status{min-height:1.5em;font-size:.9rem}
    .note{font-size:.8rem}
    @media(max-width:420px){main{padding:22px 16px}.url-row{flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <h1>Partager la page</h1>
    <p>Scanne ce QR code ou copie le lien pour l’envoyer dans un message.</p>
    <img id="qr" alt="QR code menant à la page Encodeur Arbre des mots">
    <p class="note">Le QR code est chargé depuis un service externe.</p>
    <div class="url-row">
      <input id="page-url" type="url" readonly aria-label="Lien direct vers la page">
      <button id="copy" type="button">Copier le lien</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <a class="back" href="index.html">← Retour au site</a>
  </main>
  <script>
    const pageUrl=new URL('./',window.location.href);
    const urlField=document.getElementById('page-url');
    const qrImage=document.getElementById('qr');
    const status=document.getElementById('status');
    urlField.value=pageUrl.href;
    qrImage.src=`https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(pageUrl.href)}`;
    qrImage.addEventListener('error',()=>{status.textContent='QR code indisponible. Le lien reste accessible ci-dessus.'});
    document.getElementById('copy').addEventListener('click',async()=>{
      try{
        await navigator.clipboard.writeText(pageUrl.href);
        status.textContent='Lien copié dans le presse-papiers.';
      }catch{
        urlField.focus();
        urlField.select();
        let copied=false;
        try{copied=document.execCommand('copy')}catch{}
        status.textContent=copied?'Lien copié dans le presse-papiers.':'Copie automatique impossible. Sélectionne le lien ci-dessus pour le copier.';
      }
    });
  </script>
</body>
</html>
